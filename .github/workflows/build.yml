name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test e build APK debug
        run: gradle testDebugUnitTest assembleDebug --stacktrace
        env:
          # Opzionali: se assenti l'app chiede il token Mapbox al primo avvio.
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk lavia-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lavia-tracker-apk
          path: lavia-tracker.apk

      - name: Pubblica APK nella release "apk-latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Ultima build (APK)" \
              --notes "APK debug generato automaticamente da GitHub Actions. Installalo sul telefono Android." \
              --target "$GITHUB_SHA"
          gh release upload apk-latest lavia-tracker.apk --clobber
